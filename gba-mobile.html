.lid{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(13px)}

 {id:'captain',gender:'male',name:'远航船长',icon:'⚓',color:'#c6d6ca',shirt:'#435c6c',pants:'#655e53',

 {id:'swordsman',gender:'female',hair:'high-pony',name:'云游剑客',icon:'⚔',color:'#d3dfca',shirt:'#456365',pants:'#5b6560',

function stopVoice(){voiceToken++;if(window.speechSynthesis)speechSynthesis.cancel();if(speaking){speaking.classList.remove('playing');speaking.querySelector('.play-icon').textContent='▶';speaking.querySelector('.voice-label').textContent='设备朗读';speaking=null}}
function play(btn){if(!on||!lidOpen||choosing||giftOpen)return;if(speaking===btn){stopVoice();return}stopVoice();if(!window.speechSynthesis){$('.voice-label').textContent='可直接阅读';return}const u=new SpeechSynthesisUtterance($('#dialogue').textContent),token=voiceToken;u.lang='zh-CN';u.rate=.92;speaking=btn;btn.classList.add('playing');btn.querySelector('.play-icon').textContent='Ⅱ';btn.querySelector('.voice-label').textContent='停止';u.onend=()=>{if(token===voiceToken)stopVoice()};u.onerror=()=>{if(token===voiceToken){stopVoice();$('.voice-label').textContent='可直接阅读'}};speechSynthesis.speak(u)}
function render(){choosing=false;giftOpen=false;$('#giftPanel').hidden=true;$('#peopleMenu').hidden=true;$('.encounter').hidden=false;const p=people[current],step=progress[current],last=p.pages.length;$('#chatName').textContent=p.name;scene();$('#dialogue').textContent=step<last?p.pages[step]:step===last?p.gift.offer:p.gift.thanks;$('#sceneGift').innerHTML=step>=last?giftArt(p.id,ballOpen&&p.id==='maker'):'';$('#sceneGift').hidden=step<last;$('#sceneGift').setAttribute('aria-label','查看'+p.gift.name);$('#sceneGift').title=p.gift.name;$('.voice').onclick=e=>play(e.currentTarget);$('.a-button').setAttribute('aria-label',step<last?'A 继续':step===last?'A 收下'+p.gift.name:'A 选择人物');}
function showPeople(){if(!on||!lidOpen)return;stopVoice();giftOpen=false;$('#giftPanel').hidden=true;selection=current;choosing=true;drawPeople()}
function drawPeople(){ $('#chatName').textContent='选择人物';$('.encounter').hidden=true;$('#peopleMenu').hidden=false;$('#peopleMenu').innerHTML=people.map((p,i)=>`<button role="option" aria-selected="${i===selection}" class="person-option ${i===selection?'selected':''}" data-person="${i}"><span>${p.icon}</span>${p.name}<b>${i===selection?'◀':received.has(i)?'✓':''}</b></button>`).join('');$('#peopleMenu').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{if(!on||!lidOpen)return;current=+b.dataset.person;render()});const selected=$('.person-option.selected'),menu=$('#peopleMenu');if(selected.offsetTop<menu.scrollTop)menu.scrollTop=selected.offsetTop;else if(selected.offsetTop+selected.offsetHeight>menu.scrollTop+menu.clientHeight)menu.scrollTop=selected.offsetTop+selected.offsetHeight-menu.clientHeight;$('.a-button').setAttribute('aria-label','A 选择'+people[selection].name);}
function showGift(){if(!on||!lidOpen||choosing)return;stopVoice();giftOpen=true;received.add(current);progress[current]=people[current].pages.length+1;$('.encounter').hidden=true;$('#giftPanel').hidden=false;const p=people[current],g=p.gift;$('#giftPanel').innerHTML=`<button class="gift-art ${p.id==='maker'?'turnable':''}" aria-label="${p.id==='maker'?(ballOpen?'合上机关球':'转动机关球'):'返回对话'}">${giftArt(p.id,ballOpen)}</button><h2>${g.name}</h2><p>${g.detail}</p>${(g.lines||[]).map(line=>`<p class="ticket-line">${line}</p>`).join('')}${p.id==='driver'?'<label class="destination">目的地<input maxlength="40" placeholder="想去哪里？" aria-label="目的地"></label>':''}<p>${g.thanks}</p>`;$('#giftPanel').scrollTop=0;$('#giftPanel .gift-art').onclick=()=>{if(!on||!lidOpen)return;if(p.id==='maker'){ballOpen=!ballOpen;showGift()}else render()};if(p.id==='driver'){const input=$('#giftPanel input');input.value=destination;input.oninput=()=>destination=input.value}$('.a-button').setAttribute('aria-label',p.id==='maker'?'A 转动机关球':'A 返回对话');}
function move(n){if(!on||!lidOpen||giftOpen)return;if(!choosing){stopVoice();current=(current+n+people.length)%people.length;render();return}selection=(selection+n+people.length)%people.length;drawPeople()}
function advance(){if(!on||!lidOpen)return;stopVoice();if(giftOpen){if(people[current].id==='maker'){ballOpen=!ballOpen;showGift()}else render();return}if(choosing){current=selection;render();return}if(progress[current]<people[current].pages.length){progress[current]++;render()}else if(progress[current]===people[current].pages.length)showGift();else showPeople()}
function back(){if(!on||!lidOpen)return;stopVoice();if(giftOpen||choosing){render();return}if(progress[current]>0){progress[current]--;render()}else showPeople()}
$('#sceneGift').onclick=showGift;$('#nextPerson').onclick=()=>{if(choosing||giftOpen)back();else showPeople()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>move(+b.dataset.step));$('.a-button').onclick=advance;$('.b-button').onclick=back;$('#start').onclick=()=>{if(on&&!choosing&&!giftOpen)play($('.voice'))};$('#select').onclick=showPeople;$('.power').onclick=()=>{on=!on;stopVoice();$('.console').classList.toggle('off',!on);$('.power').setAttribute('aria-label',on?'关闭电源':'打开电源')};$('#sound').textContent='设备朗读';$('#sound').setAttribute('aria-label','朗读当前对白');$('#sound').onclick=()=>play($('.voice'));document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;const k=e.key.toLowerCase();if(k==='a'){e.preventDefault();advance();return}if(k==='b'||k==='escape'){e.preventDefault();back();return}if(k.startsWith('arrow')){e.preventDefault();move(k==='arrowright'||k==='arrowdown'?1:-1);return}if(e.target.closest('button,a'))return;if(k==='enter'){e.preventDefault();advance()}});render();

function buildSPRim(){
 const shell=$('.sp-lid-motion'),rim=$('.sp-lid-solid');
 const width=shell.offsetWidth,height=shell.offsetHeight,points=[];
 for(const [cx,cy,r,start] of [[width-22,22,22,-90],[width-15,height-15,15,0],[15,height-15,15,90],[22,22,22,180]]){
  for(let n=0;n<=10;n++){const angle=(start+n*9)*Math.PI/180;points.push([cx+r*Math.cos(angle),cy+r*Math.sin(angle)])}
 }
 rim.replaceChildren();
 points.forEach((a,i)=>{const b=points[(i+1)%points.length],angle=Math.atan2(b[1]-a[1],b[0]-a[0]);const wall=document.createElement('i');
  wall.style.left=(a[0]+b[0])/2+'px';wall.style.top=(a[1]+b[1])/2+'px';wall.style.width=Math.hypot(b[0]-a[0],b[1]-a[1])+.4+'px';
  wall.style.setProperty('--rim-angle',angle*180/Math.PI+'deg');wall.style.setProperty('--rim-color','hsl(208 13% '+(73+5*Math.cos(angle+.6))+'%)');rim.append(wall);
 });
}
buildSPRim();new ResizeObserver(buildSPRim).observe($('.sp-lid-motion'));
