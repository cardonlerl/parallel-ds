.is-closed .lid-motion{transform:rotateX(-180deg)}

function stopVoice(){if(window.speechSynthesis)speechSynthesis.cancel();if(speaking){speaking.classList.remove('playing');speaking.querySelector('.play-icon').textContent='▶';speaking.querySelector('.voice-label').textContent='听他说';speaking=null}}
function play(btn){if(!on||!lidOpen)return;if(speaking===btn){stopVoice();return}stopVoice();if(!window.speechSynthesis){$('.voice-label').textContent='此浏览器不支持朗读';return}const u=new SpeechSynthesisUtterance($('#dialogue').textContent);u.lang='zh-CN';u.rate=.92;speaking=btn;btn.classList.add('playing');btn.querySelector('.play-icon').textContent='Ⅱ';btn.querySelector('.voice-label').textContent='暂停';u.onend=()=>stopVoice();u.onerror=()=>{stopVoice();$('.voice-label').textContent='朗读不可用，可直接阅读'};speechSynthesis.speak(u)}
function render(){choosing=false;$('#peopleMenu').hidden=true;$('.encounter').hidden=false;const p=people[current],g=gifts[current],step=progress[current];$('#chatName').textContent=p.name;scene();$('#dialogue').textContent=step===0?p.text:step===1?g.offer:g.thanks;$('#sceneGift').textContent=step?g.icon:'';$('#sceneGift').title=step?g.name:'';$('.voice').onclick=e=>play(e.currentTarget);$('.encounter').style.background=current===1?'#344654':'#d3dfbc';$('.a-button').setAttribute('aria-label',step===0?'A 继续':step===1?'A 收下'+g.name:'A 选择人物');}
function showPeople(){if(!on||!lidOpen)return;stopVoice();selection=current;choosing=true;drawPeople()}
function drawPeople(){ $('#chatName').textContent='选择人物';$('.encounter').hidden=true;$('#peopleMenu').hidden=false;$('#peopleMenu').innerHTML=people.map((p,i)=>`<div role="option" aria-selected="${i===selection}" class="person-option ${i===selection?'selected':''}"><span>${['🥐','☾','✿'][i]}</span>${p.name}<b>${i===selection?'◀':''}</b></div>`).join('')+'<p class="select-hint">方向键选择　A 确认　B 返回</p>';$('.a-button').setAttribute('aria-label','A 选择'+people[selection].name);}
function move(n){if(!on||!lidOpen)return;if(!choosing)return;selection=(selection+n+people.length)%people.length;drawPeople()}
function advance(){if(!on||!lidOpen)return;stopVoice();if(choosing){current=selection;render();return}if(progress[current]<2){progress[current]++;render()}else showPeople()}
function back(){if(!on||!lidOpen)return;stopVoice();if(choosing){render();return}if(progress[current]>0){progress[current]--;render()}else showPeople()}
$('#nextPerson').onclick=showPeople;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>move(+b.dataset.step));$('.a-button').onclick=advance;$('.b-button').onclick=back;$('#start').onclick=()=>{if(on&&!choosing)play($('.voice'))};$('#select').onclick=showPeople;$('.power').onclick=()=>{on=!on;stopVoice();$('.console').classList.toggle('off',!on);$('.power').setAttribute('aria-label',on?'关闭电源':'打开电源')};$('#sound').textContent='语音使用设备朗读';$('#sound').setAttribute('aria-label','朗读当前对白');$('#sound').onclick=()=>{if(!choosing)play($('.voice'))};document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'){e.preventDefault();advance();return}if(k==='b'||k==='escape'){e.preventDefault();back();return}if(k.startsWith('arrow')){e.preventDefault();move(k==='arrowright'||k==='arrowdown'?1:-1);return}if(e.target.closest('button,a'))return;if(k==='enter'){e.preventDefault();advance()}});render();

function buildSPRim(){
 const shell=$('.sp-lid-motion'),rim=$('.sp-lid-solid');
 if(document.body.dataset.model!=='sp')return;
 const width=shell.offsetWidth,height=shell.offsetHeight,points=[];
 for(const [cx,cy,r,start] of [[width-22,22,22,-90],[width-15,height-15,15,0],[15,height-15,15,90],[22,22,22,180]]){
  for(let n=0;n<=10;n++){const angle=(start+n*9)*Math.PI/180;points.push([cx+r*Math.cos(angle),cy+r*Math.sin(angle)])}
 }
 rim.replaceChildren();
 points.forEach((a,i)=>{const b=points[(i+1)%points.length],angle=Math.atan2(b[1]-a[1],b[0]-a[0]);const wall=document.createElement('i');
  wall.style.left=(a[0]+b[0])/2+'px';wall.style.top=(a[1]+b[1])/2+'px';wall.style.width=Math.hypot(b[0]-a[0],b[1]-a[1])+.4+'px';
  wall.style.setProperty('--rim-angle',angle*180/Math.PI+'deg');wall.style.setProperty('--rim-color','hsl(208 13% '+(73+5*Math.cos(angle+.6))+'%)');rim.append(wall);
 });
}
if(document.body.dataset.model==='sp'){buildSPRim();new ResizeObserver(buildSPRim).observe($('.sp-lid-motion'))}
if(!lidOpen){
 $('.console').classList.add('sp-closed');
 const controls=[...document.querySelectorAll('.console button:not(.sp-cover)')];
 controls.forEach(b=>b.inert=true);
 $('.sp-cover').onclick=()=>{
  if(lidOpen||!$('.console').classList.contains('sp-closed'))return;
  $('.sp-cover').blur();$('.sp-cover').tabIndex=-1;
  $('.console').classList.remove('sp-closed');
  const ready=()=>{lidOpen=true;controls.forEach(b=>b.inert=false);$('.sp-cover').inert=true;$('.a-button').focus({preventScroll:true})};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)ready();
  else $('.sp-lid-motion').addEventListener('transitionend',ready,{once:true});
 };
}else{$('.sp-cover').inert=true}
</script></body></html>
