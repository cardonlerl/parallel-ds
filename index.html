<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>另一边 · Pocket DS</title><style>

px;font-size:9px;color:#849076}.world-item{display:block;width:100%;text-align:left;background:#f4f4e4;border:1px solid #bac6aa;padding:8px;font-size:11px;margin-bottom:6px}.world-item.selected{border-color:#6f8a5c;background:#dbe7c9}.world-item span{float:right;color:#82936d;font-size:10px}.off .screen{background:#596151}.off .screen>*{visibility:hidden}.off .leds i{background:#a0aa98;box-shadow:none}.hint{margin-top:30px;font-size:11px;letter-spacing:1px;color:#687e72;display:flex;gap:20px}.sound{border:0;background:none;font-size:11px;color:#687e72;padding:8px}.shell-label{position:absolute;left:30px;top:25px;font:8px Arial;letter-spacing:1px;color:#a3ac9b}.boot{position:absolute;inset:0;background:#e8eee0;display:grid;place-content:center;text-align:center;z-index:20;font-size:16px;letter-spacing:3px}.boot small{font-size:9px;letter-spacing:2px;margin-top:15px}.stamp{font-size:36px;text-align:center;margin:5px 0 9px}.notebook{text-align:center;font-size:12px;line-height:1.8}@media(max-width:690px){.console{zoom:.8}.stage{padding-top:25px}}@media(max-width:550px){.console{zoom:.63}.hint{font-size:10px;gap:10px}}@media(max-width:430px){.console{zoom:.52}}@media(prefers-reduced-motion:no-preference){.console{animation:arrive .7s ease-out}@keyframes arrive{from{opacity:0;translate:0 15px}to{opacity:1;translate:0 0}}}.visually-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}

/* The two faces rotate together around the physical hinge. */
.console{filter:none;perspective:1800px;transform:rotate(-2deg) translateY(0);transition:transform 1.15s cubic-bezier(.22,.75,.2,1)}
.console.is-closed{transform:rotate(-2deg) translateY(-151px)}

</style></head><body><main class="stage"><div class="console is-closed" aria-label="平行世界双屏掌机"><div class="lid-motion"><section class="lid" inert><i class="screw a"></i><i class="screw b"></i><div class="speaker" aria-hidden="true"></div><div class="speaker right" aria-hidden="true"></div><div class="bezel"><div class="screen"><div class="status"><span class="signal"><i></i><i></i><i></i></span><span id="clock">16:24</span><span>CONNECTED <i class="battery"></i></span></div><div class="world"><div id="scene"></div><span class="world-tag" id="worldTag"></span></div></div></div><div class="brand">another me</div></section><button class="lid-cover" aria-label="打开掌机盖子"><span class="cover-mark" aria-hidden="true"><i></i><i></i></span><span class="cover-name">another me</span></button></div><div class="hinge"><div class="leds"><i></i><i></i></div></div><section class="base" inert><span class="shell-label">L</span><div class="dpad"><button class="up" aria-label="上一个世界" data-step="-1">▴</button><button class="left" aria-label="上一个世界" data-step="-1">◂</button><button class="rightkey" aria-label="下一个世界" data-step="1">▸</button><button class="down" aria-label="下一个世界" data-step="1">▾</button></div><div class="bezel"><div class="screen lower"><nav class="tabs"><button class="tab active" data-tab="chat">通讯</button><button class="tab" data-tab="worlds">世界</button><button class="tab" data-tab="bag">口袋</button></nav><div class="content" id="content" aria-live="polite"></div><div class="foot"><span id="footText">● 信号已接通</span><span>A 确认　B 返回</span></div></div></div><div class="actions"><button class="x" aria-label="X 世界列表">X</button><button class="y" aria-label="Y 口袋">Y</button><button class="a-button" aria-label="A 确认">A</button><button class="b-button" aria-label="B 返回">B</button></div><div class="utility"><label><button class="tiny" id="start" aria-label="Start 返回通讯"></button>START</label><label><button class="tiny" id="select" aria-label="Select 切换世界"></button>SELECT</label></div><button class="power" aria-label="关闭电源" title="电源">⏻</button><span class="mic">MIC</span></section></div><div class="hint"><span>方向键切换世界</span><span>Enter / A 对话</span><button class="sound" id="sound" aria-label="开启声音">声音 关</button></div></main><script>
const $=s=>document.querySelector(s);let opened=false;let current=0,tab='chat',on=true,sound=false,lines=0,received=new Set();const worlds=[{name:'面包师',place:'麦穗街 · 05:12',color:'#c4d4b0',hello:'你那边也是凌晨吗？\n我这炉面包刚出炉。',reply:'那第一只就留给你。\n小心，还热着呢。',gift:'一只刚出炉的面包',icon:'🥐',button:'闻到香味了'},{name:'宇航员',place:'月球背面 · 21:06',color:'#9eaec0',hello:'这里看不见城市的灯。\n你今天有抬头看月亮吗？',reply:'下次抬头的时候，挥挥手吧。\n这颗小石头，送给地球上的你。',gift:'一颗月亮石',icon:'☄',button:'我正在看呢'},{name:'花店店员',place:'雨水巷 · 14:38',color:'#b9cfba',hello:'刚下过一场雨。\n今天想给自己挑什么花？',reply:'这朵小雏菊很像你。\n不赶时间的话，再坐一会儿吧。',gift:'一朵小雏菊',icon:'✿',button:'你帮我选吧'}];
function scene(){let w=worlds[current];let bg=current===1?'#344654':'#d3dfbc';let details=current===1?`<path d="M0 120Q90 85 180 120T360 125V200H0Z" fill="#adb8b5"/><g fill="#eff0cd"><rect x="35" y="26" width="3" height="3"/><rect x="100" y="50" width="3" height="3"/><rect x="250" y="20" width="3" height="3"/><rect x="290" y="65" width="3" height="3"/></g><circle cx="265" cy="48" r="21" fill="#8dbaba"/><path d="M255 30l18 10-6 18-15-5z" fill="#a9c994"/>`:`<rect y="128" width="360" height="72" fill="#b8c49d"/><path d="M0 148h360M0 179h360M45 128v72M120 128v72M195 128v72M270 128v72M345 128v72" stroke="#a6b58d"/><rect x="33" y="27" width="76" height="77" fill="#92aa8b"/><rect x="39" y="33" width="64" height="65" fill="#c1dbce"/><path d="M71 33v65M39 65h64" stroke="#eff0d7" stroke-width="5"/><rect x="241" y="42" width="90" height="7" fill="#9a916f"/><rect x="241" y="86" width="90" height="7" fill="#9a916f"/>${current===0?'<g fill="#c6a366" stroke="#a18b5e" stroke-width="2"><path d="M251 39q0-25 19-20q19-5 19 20z"/><path d="M294 39q0-20 12-18q14-2 14 18z"/><path d="M248 82q0-20 17-17q17-3 17 17z"/><path d="M291 82q0-20 17-17q17-3 17 17z"/></g>':'<g fill="#b99194"><circle cx="262" cy="26" r="10"/><circle cx="307" cy="67" r="10"/></g><path d="M262 27v15M307 69v15" stroke="#6a9266" stroke-width="5"/>'}`;
$('#scene').style.height='100%';$('#scene').innerHTML=`<svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img" aria-label="另一个世界的${w.name}"><rect width="360" height="200" fill="${bg}"/>${details}<ellipse cx="179" cy="173" rx="32" ry="8" fill="#405941" opacity=".18"/><path d="M158 145v29h15v-20h13v20h15v-29" fill="#6a7867"/><path d="M156 105h45l10 45h-65z" fill="${current===1?'#e4e7d6':current===0?'#ecebd5':'#819c7a'}"/><path d="M150 111l-10 26h12l12-23M199 111l12 26h-12l-9-23" fill="#d6b798"/><rect x="157" y="65" width="44" height="42" rx="10" fill="#dcc2a2"/><path d="M155 83V62h47v22h-9V73h-28v10z" fill="#6b6555"/><rect x="166" y="86" width="4" height="5" fill="#50574a"/><rect x="187" y="86" width="4" height="5" fill="#50574a"/><path d="M175 98h9" stroke="#a17c66" stroke-width="2"/>${current===0?'<path d="M152 65V53h8V43h13v-5h18v6h12v21z" fill="#f4f1dd"/><path d="M162 113v32h33v-32" fill="#c0cdb0"/>':current===1?'<rect x="147" y="58" width="64" height="56" rx="20" fill="none" stroke="#e7ead8" stroke-width="7"/><rect x="164" y="121" width="29" height="15" fill="#8eaaa2"/>':'<path d="M149 67h62v-8h-11V48h-43v11h-8z" fill="#d2bd88"/><rect x="165" y="116" width="26" height="28" fill="#c2d1ac"/>'}${current===0?'<rect x="111" y="151" width="137" height="12" fill="#af966f"/><rect x="121" y="163" width="8" height="37" fill="#8e805f"/><rect x="229" y="163" width="8" height="37" fill="#8e805f"/><path d="M158 149q0-22 24-22t24 22z" fill="#d7b472"/><path d="M171 132l5 10m9-11 5 10" stroke="#b38d55" stroke-width="3"/>':''}</svg>`;$('#worldTag').textContent=w.place;}
function render(){scene();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let w=worlds[current];if(tab==='chat'){$('#content').innerHTML=`<h1 class="headline">${w.name}的我</h1><p class="message">${(lines?w.reply:w.hello).replaceAll('\n','<br>')}</p><div class="choices"><button class="choice" id="reply">${lines?'收进口袋':w.button}</button><button class="choice" id="next">再遇见一个我</button></div>`;$('#reply').onclick=reply;$('#next').onclick=()=>move(1);}else if(tab==='worlds'){$('#content').innerHTML=worlds.map((w,i)=>`<button class="world-item ${i===current?'selected':''}" data-world="${i}">${w.name}的我<span>${i===current?'已连接':'连接'}</span></button>`).join('');document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{current=+b.dataset.world;lines=0;tab='chat';beep();render()})}else{$('#content').innerHTML=received.size?[...received].map(i=>`<div class="world-item">${worlds[i].icon}　${worlds[i].gift}</div>`).join(''):'<div class="stamp">✉</div><div class="notebook">口袋还是空的。<br>去和另一个自己打个招呼吧。</div>'}$('#footText').textContent=tab==='bag'?`${received.size} 件来自另一边的礼物`:'● 信号已接通';}
let audio;function beep(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.1)}catch{}}
function reply(){if(!on||!opened)return;beep();if(!lines){lines=1}else{received.add(current);tab='bag'}render()}function move(n){if(!on||!opened)return;beep();current=(current+n+worlds.length)%worlds.length;lines=0;render()}function setTab(t){if(!on||!opened)return;beep();tab=t;render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>move(+b.dataset.step));$('.a-button').onclick=()=>{if(!on||!opened)return;if(tab==='chat')reply();else setTab('chat')};$('.b-button').onclick=()=>setTab('chat');$('.x').onclick=()=>setTab('worlds');$('.y').onclick=()=>setTab('bag');$('#start').onclick=()=>setTab('chat');$('#select').onclick=()=>move(1);$('.power').onclick=()=>{on=!on;$('.console').classList.toggle('off',!on);$('.power').setAttribute('aria-label',on?'关闭电源':'打开电源');beep()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='声音 '+(sound?'开':'关');$('#sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');beep()};document.addEventListener('keydown',e=>{if(!opened)return;if(e.target.tagName==='BUTTON')return;let k=e.key.toLowerCase();if(['arrowleft','arrowup','arrowright','arrowdown','enter','a','b','escape','x','y'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='arrowup')move(-1);if(k==='arrowright'||k==='arrowdown')move(1);if(k==='enter'||k==='a')$('.a-button').click();if(k==='b'||k==='escape')setTab('chat');if(k==='x')setTab('worlds');if(k==='y')setTab('bag')});document.querySelectorAll('.speaker').forEach(s=>s.innerHTML='<i></i>'.repeat(12));function clock(){ $('#clock').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}clock();setInterval(clock,60000);render();
$('.lid-cover').onclick=()=>{
 if(opened)return;
 opened=true;
 $('.console').classList.remove('is-closed');
 $('.lid-cover').blur();
 $('.lid-cover').setAttribute('tabindex','-1');
 $('.lid-cover').setAttribute('aria-hidden','true');
 const ready=()=>{ $('.lid').inert=false;$('.base').inert=false;$('.tab').focus({preventScroll:true}); };
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)ready();
 else $('.lid-motion').addEventListener('transitionend',ready,{once:true});
};
</script></body></html>
